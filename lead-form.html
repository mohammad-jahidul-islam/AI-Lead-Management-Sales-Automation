<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Automation Consultation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }

    .container {
      max-width: 550px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 18px;
      box-sizing: border-box;
    }

    textarea {
      height: 130px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>AI Automation Consultation</h1>

  <p>Tell us about your business requirements.</p>

  <form id="leadForm">

    <label>Name</label>
    <input type="text" id="name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Company</label>
    <input type="text" id="company" required>

    <label>What do you need help with?</label>
    <textarea id="message" required></textarea>

    <button type="submit">Submit Enquiry</button>

  </form>

  <div id="status"></div>

</div>

<script>

document.getElementById("leadForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    company: document.getElementById("company").value,
    message: document.getElementById("message").value
  };

  const status = document.getElementById("status");

  status.innerText = "Submitting...";

  try {

    const response = await fetch(
      "http://localhost:5678/webhook/lead-form",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      }
    );

    if (!response.ok) {
      throw new Error("Request failed");
    }

    status.innerText = "Thank you! Your enquiry has been submitted.";

    document.getElementById("leadForm").reset();

  } catch (error) {

    status.innerText = "Unable to submit the enquiry.";

    console.error(error);
  }

});

</script>

</body>
</html>
